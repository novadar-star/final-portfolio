  <script>
    // ===========================
    // Render all system cards
    // ===========================
    (function () {
      const list = document.getElementById('systems-list');
      if (!list || !window.PROJECTS) return;

      PROJECTS.forEach(function (project) {
        const article = document.createElement('article');
        article.className = 'system-card scroll-reveal' + (project.featured ? ' featured' : '');
        article.setAttribute('role', 'listitem');
        article.setAttribute('data-project', project.id);

        // Determine visual type
        const hasWorkflowCanvas = ['ai-job-scraper','gtm-outbound','zero-touch-attendee','google-maps-leads'].includes(project.id);
        const visualClass = hasWorkflowCanvas ? 'workflow-canvas' : '';

        // Build external links HTML
        let externalLinks = '';
        if (project.caseStudyUrl) {
          externalLinks += `<a href="${project.caseStudyUrl}" target="_blank" rel="noopener noreferrer" class="system-link-icon" aria-label="View case study for ${project.title}">&#128279;</a>`;
        }
        if (project.githubUrl) {
          externalLinks += `<a href="${project.githubUrl}" target="_blank" rel="noopener noreferrer" class="system-link-icon" aria-label="View ${project.title} on GitHub">&#128279;</a>`;
        }
        if (project.liveUrl) {
          externalLinks += `<a href="${project.liveUrl}" target="_blank" rel="noopener noreferrer" class="system-link-icon" aria-label="Visit ${project.title} live site">&#128279;</a>`;
        }

        // Build visual HTML
        let visualHTML = '';
        if (project.hasVideo && project.videoSrc) {
          visualHTML = `
            <div class="system-visual" aria-hidden="true">
              <video class="project-video" autoplay loop muted playsinline preload="none" poster="${project.image}">
                <source src="${project.videoSrc}" type="video/mp4">
              </video>
            </div>`;
        } else if (project.image) {
          visualHTML = `
            <div class="system-visual ${visualClass}" aria-hidden="true">
              <img src="${project.image}" alt="${project.imageAlt || ''}" loading="lazy">
            </div>`;
        }

        // Build tags HTML
        const tagsHTML = project.tags
          .map(t => `<span class="tech-pill">${t}</span>`)
          .join('');

        // Build deep-link (if detail page exists — flagship + supported ones)
        const hasDetailPage = ['ai-job-scraper'].includes(project.slug);
        const deepLink = hasDetailPage
          ? `<a href="systems/${project.slug}.html" class="system-deeplink">read the full build &rarr;</a>`
          : '';

        // Unique connector id
        const connectorId = `connector-${project.id}`;

        article.innerHTML = `
          <div class="system-card-meta">
            <span class="system-category">${project.category}</span>
            <span class="system-year">${project.year}</span>
            <span class="system-status">${project.status}</span>
          </div>
          <div class="system-card-header">
            ${hasDetailPage
              ? `<a href="systems/${project.slug}.html" class="system-title">${project.title}</a>`
              : `<h2 class="system-title" style="cursor:default;">${project.title}</h2>`
            }
            <div style="display:flex;gap:6px;align-items:center;">${externalLinks}</div>
          </div>
          <p class="system-desc">${project.shortDesc}</p>
          ${visualHTML}
          <div
            class="connector"
            id="${connectorId}"
            role="group"
            aria-label="Pipeline stages for ${project.title}"
          ></div>
          <span class="connector-hint">tap a stage to see what happens there</span>
          <div class="system-tags card-tags">${tagsHTML}</div>
          ${deepLink}
        `;

        list.appendChild(article);

        // Render connector diagram nodes into this card
        renderConnector(connectorId, project);
      });

      // Register scroll reveal for dynamically inserted cards.
      // main.js exposes registerScrollReveal() on window; call after all
      // cards are in the DOM. Use rAF to ensure paint has started.
      requestAnimationFrame(function () {
        if (typeof window.registerScrollReveal === 'function') {
          window.registerScrollReveal();
        }
      });
    })();

    // ===========================
    // Render connector diagram
    // ===========================
    function renderConnector(containerId, project) {
      const container = document.getElementById(containerId);
      if (!container || !project.connector) return;

      let openAnnotation = null;

      project.connector.forEach(function (stage, i) {
        const stageEl = document.createElement('div');
        stageEl.className = 'connector-stage';

        const node = document.createElement('div');
        node.className = 'connector-node';
        node.style.position = 'relative';

        // Button
        const btn = document.createElement('button');
        btn.className = 'connector-stage-btn';
        btn.textContent = stage.label;
        btn.setAttribute('aria-expanded', 'false');
        btn.setAttribute('aria-controls', `ann-${containerId}-${i}`);
        btn.setAttribute('type', 'button');

        // Annotation panel
        const ann = document.createElement('div');
        ann.className = 'connector-annotation';
        ann.id = `ann-${containerId}-${i}`;
        ann.setAttribute('role', 'tooltip');
        ann.textContent = stage.annotation;

        // Toggle logic — only one open at a time per connector
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const isOpen = ann.classList.contains('open');

          // Close currently open annotation in this connector
          if (openAnnotation && openAnnotation !== ann) {
            openAnnotation.classList.remove('open');
            const prevBtn = openAnnotation.previousElementSibling;
            if (prevBtn) prevBtn.setAttribute('aria-expanded', 'false');
          }

          if (isOpen) {
            ann.classList.remove('open');
            btn.setAttribute('aria-expanded', 'false');
            openAnnotation = null;
          } else {
            ann.classList.add('open');
            btn.setAttribute('aria-expanded', 'true');
            openAnnotation = ann;
          }
        });

        node.appendChild(btn);
        node.appendChild(ann);
        stageEl.appendChild(node);

        // Wire between stages
        if (i < project.connector.length - 1) {
          const wire = document.createElement('div');
          wire.className = 'connector-wire';
          wire.setAttribute('aria-hidden', 'true');
          stageEl.appendChild(wire);
        }

        container.appendChild(stageEl);
      });

      // Close annotation when clicking outside this connector
      document.addEventListener('click', function () {
        if (openAnnotation) {
          openAnnotation.classList.remove('open');
          const prevBtn = openAnnotation.previousElementSibling;
          if (prevBtn) prevBtn.setAttribute('aria-expanded', 'false');
          openAnnotation = null;
        }
      });
    }
  </script>
